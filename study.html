<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RootedOS | Study Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body data-page="study">
  <main class="page-shell">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="brand-mark"></span><span>RootedOS</span></a>
      <nav class="nav-links"><a href="trail.html">Trail</a><a href="journal.html">Journal</a><a href="account.html">My RootedOS</a></nav>
    </header>

    <section data-study-body></section>

    <section class="journal-box">
      <span class="eyebrow">Journal</span>
      <h2>Write what you are noticing</h2>
      <p class="status" data-status></p>
      <textarea data-journal-text placeholder="Write your reflection here..."></textarea>
      <div class="actions">
        <a class="primary-btn" href="#" data-save-journal>Save Journal</a>
        <a class="secondary-btn" href="#" data-generate-ppt>Generate Study PPT</a>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script>
    window.addEventListener('error', function (event) {
      if (String(event && event.target && event.target.src || '').includes('pptxgen')) {
        console.error('PptxGenJS CDN failed to load. RootedOS will try a backup when PPT is requested.');
      }
    }, true);
  </script>
  <script src="rootedos.js?v=8"></script>
</body>
</html>
