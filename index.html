<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RootedOS | Truth Trail Discovery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body data-page="index">
  <main class="page-shell home-shell minimal-home">
    <section class="frame" aria-label="RootedOS truth discovery home">
      <div class="home-stage home-stage-minimal">
        <section class="start-pane start-pane-minimal" aria-label="Tap to begin">
          <button class="orb-link orb-trigger home-orb-trigger" type="button" data-open-input aria-label="Open RootedOS input">
            <span class="orb home-main-orb" aria-hidden="true"></span>
          </button>
          <div class="micro-label">Open the orb</div>
          <p class="home-mini-copy">Paste a link, passage, question, quote, caption, scene, emotion, or thought.</p>
          <p class="status" data-status></p>
        </section>
      </div>
    </section>
  </main>

  <section class="input-panel" data-input-panel aria-modal="true" aria-label="RootedOS input orb">
    <form class="input-card orb-input-card orb-lens-form" data-input-form>
      <textarea data-rooted-input aria-label="RootedOS input" placeholder="Paste anything here..."></textarea>
      <div class="actions orb-actions">
        <button class="primary-btn" type="submit">Begin Trail</button>
        <button class="secondary-btn" type="button" data-close-input>Close</button>
      </div>
      <p class="status" data-status></p>
    </form>
  </section>

  <script src="rootedos.js"></script>
</body>
</html>
